# Argus Prime Default Configuration
# All settings can be overridden via environment variables

# Application Settings
app:
  host: "0.0.0.0"
  port: 8000
  debug: false
  workers: 4

# Database Configuration (PostgreSQL)
database:
  url: "postgresql+asyncpg://argus:argus@localhost:5432/argus_prime"
  pool_size: 10
  max_overflow: 20

# Redis Configuration
redis:
  host: "localhost"
  port: 6379
  db: 0
  key_prefix: "argus:"

# Storage Configuration
storage:
  temp_dir: "/tmp/argus_uploads"
  max_file_size: 500000000  # 500MB
  ttl_seconds: 86400  # 24 hours

# Model Configuration
models:
  video:
    primary: "forensic_flow"
    fallback: ["distil_dire", "kan_detector"]
    batch_size: 8
  audio:
    primary: "rawnet2"
    fallback: ["transcrypt"]
    segment_duration: 2
  text:
    primary: "spec_detect"
    fallback: ["perplexity_detector"]

# Analysis Configuration
analysis:
  default_fps: 5
  min_face_size: 64
  confidence_threshold: 0.5
  fusion:
    video_weight: 0.40
    audio_weight: 0.35
    text_weight: 0.25
    cross_modal_adjustment: 0.20

# Adversarial Defense Configuration
defense:
  enabled: true
  jpeg_quality: 85
  noise_std: 0.01
  trim_threshold: 0.1

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  include_timestamp: true

# Metrics Configuration
metrics:
  enabled: true
  port: 9090
  path: "/metrics"
