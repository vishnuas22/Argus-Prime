[pytest]
# P0d: two-tier test config. No markers existed before this file, so
# `pytest -m fast` selected nothing and CI could not gate on tests.
#
#   fast  — fixture-only, no real models, no corpora. Runs every PR, tokenless.
#   slow  — real models / real corpora. Nightly only, needs the artifact bundle.
markers =
    fast: fixture-only test; no real models or corpora (every PR)
    slow: needs real models or corpora; nightly only

# Keep collection deterministic and quiet.
testpaths = tests
norecursedirs = .venv .git integrations/Argus_Master/.git artifacts logs data
addopts = -ra --strict-markers